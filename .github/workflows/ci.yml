name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests don't need the YOLO model, so CI installs only the light
      # dependencies (headless OpenCV, no PyTorch) to stay fast.
      - run: pip install opencv-python-headless pytest ruff
      - run: ruff check src tests
      - run: pytest -q
